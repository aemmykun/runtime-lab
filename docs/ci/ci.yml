# CI template for Runtime Lab.
# This file lives in docs/ci/ because the token used to create the repo has no
# `workflow` scope. To enable it, copy it to .github/workflows/ci.yml.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - name: Build core (needed by the web postbuild step and the CLI)
        run: npm run build -w @runtime-lab/core
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Browser smoke test of the built static site (uses the runner's Google Chrome)
        run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome

  # Optional: run a JSON test suite against a real provider and fail on regressions.
  # Needs a repository secret (e.g. OPENAI_API_KEY). Never commit keys.
